name: Codex Review Bot
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Run Codex review via LiteLLM
        env:
          LITELLM_KEY: ${{ secrets.LITELLM_KEY }}
          LITELLM_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, json
          from urllib.request import urlopen, Request

          diff = open("/tmp/pr.diff").read()
          if not diff.strip():
              open("/tmp/review.md", "w").write("No changes to review.")
              exit(0)

          prompt = f"""You are a code reviewer. Review the following PR diff and provide structured feedback.

## Review Format
1. **Summary** — one paragraph assessment
2. **Issues** — bugs, security problems, edge cases (severity: HIGH/MEDIUM/LOW)
3. **Suggestions** — specific improvements
4. **Verdict** — APPROVE / REQUEST_CHANGES / COMMENT

## PR Diff
```diff
{diff[:12000]}
```"""

          body = json.dumps({
              "model": "openai/gpt-5.3-codex",
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 2000
          }).encode()

          req = Request(
              f"{os.environ['LITELLM_URL']}/chat/completions",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['LITELLM_KEY']}",
                  "Content-Type": "application/json"
              }
          )
          resp = json.loads(urlopen(req).read())
          review = resp["choices"][0]["message"]["content"]
          open("/tmp/review.md", "w").write(review)
          EOF

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Codex Review

${review}`
            });
