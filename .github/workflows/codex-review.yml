name: Codex Review Bot
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        run: |
          echo "number=${{ github.event.pull_request.number || inputs.pr_number }}" >> $GITHUB_OUTPUT

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Run Codex review via LiteLLM
        env:
          LITELLM_KEY: ${{ secrets.LITELLM_KEY }}
          LITELLM_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          cat > /tmp/review.py << 'PYEOF'
          import os, json, sys
          from urllib.request import urlopen, Request

          diff = open("/tmp/pr.diff").read()
          if not diff.strip():
              open("/tmp/review.md", "w").write("No changes to review.")
              sys.exit(0)

          prompt = (
              "You are a code reviewer. Review the following PR diff and provide structured feedback.\n\n"
              "## Review Format\n"
              "1. **Summary** - one paragraph assessment\n"
              "2. **Issues** - bugs, security problems, edge cases (severity: HIGH/MEDIUM/LOW)\n"
              "3. **Suggestions** - specific improvements\n"
              "4. **Verdict** - APPROVE / REQUEST_CHANGES / COMMENT\n\n"
              "## PR Diff\n\n"
              + diff[:12000]
          )

          payload = json.dumps({
              "model": "openai/gpt-5.3-codex",
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 2000
          }).encode()

          req = Request(
              os.environ["LITELLM_URL"] + "/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["LITELLM_KEY"],
                  "Content-Type": "application/json"
              }
          )
          resp = json.loads(urlopen(req).read())
          review = resp["choices"][0]["message"]["content"]
          open("/tmp/review.md", "w").write(review)
          PYEOF
          python3 /tmp/review.py

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');
            const prNumber = context.issue.number || ${{ steps.pr.outputs.number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '### Codex Review\n\n' + review
            });
