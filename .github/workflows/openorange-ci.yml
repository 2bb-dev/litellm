name: OpenOrange Fork CI

on:
  pull_request:
    branches: [openorange]
  push:
    branches: [openorange]

permissions:
  contents: read

concurrency:
  group: openorange-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Fork regressions and OSS guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"

      - name: Set up Rust
        run: rustup toolchain install --component rust-docs

      - name: Install test dependencies
        run: >-
          .github/scripts/uv_sync_with_retries.sh --frozen
          --group ci --group proxy-dev
          --extra proxy --extra proxy-runtime --extra extra_proxy
          --extra semantic-router

      - name: Set up Node for Pi routing integration
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: services/pi-inference/package-lock.json

      - name: Build Pi inference for fork routing integration
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/pi-inference
          npm run build --prefix services/pi-inference

      - name: Generate Prisma client
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Test LiteLLM transport through the private Pi sidecar
        run: npm run test:litellm --prefix services/pi-inference

      - name: Run focused fork regressions
        run: |
          uv run --no-sync pytest -q \
            tests/test_litellm/responses/test_responses_utils.py \
            tests/test_litellm/test_effective_token_pricing.py \
            tests/test_litellm/litellm_core_utils/llm_cost_calc/test_off_peak_pricing.py \
            tests/test_litellm/litellm_core_utils/llm_cost_calc/test_llm_cost_calc_utils.py \
            tests/test_litellm/litellm_core_utils/test_get_model_cost_map.py \
            tests/test_litellm/litellm_core_utils/test_safe_json_dumps.py \
            tests/test_litellm/litellm_core_utils/test_redact_messages.py \
            tests/test_litellm/llms/chatgpt/chat/test_chatgpt_transformation.py \
            tests/test_litellm/llms/chatgpt/responses/test_chatgpt_responses_transformation.py \
            tests/test_litellm/llms/deepseek/chat/test_deepseek_chat_transformation.py \
            tests/test_litellm/llms/custom_httpx/test_llm_http_handler.py \
            tests/llm_responses_api_testing/test_base_responses_api_streaming_iterator.py \
            tests/test_litellm/proxy/test_litellm_pre_call_utils.py \
            tests/test_litellm/router_utils/pre_call_checks/test_encrypted_content_affinity_check.py \
            tests/test_litellm/router_utils/test_fallback_event_handlers.py \
            tests/test_litellm/router_utils/test_chatgpt_rate_limit.py \
            tests/test_litellm/litellm_core_utils/test_credential_ownership.py \
            tests/test_litellm/litellm_core_utils/test_native_credential_ownership.py \
            tests/test_litellm/proxy/spend_tracking/test_spend_tracking_utils.py \
            tests/test_litellm/proxy/spend_tracking/test_request_content_encryption.py \
            tests/test_litellm/proxy/spend_tracking/test_request_content_policy.py \
            tests/test_litellm/integrations/test_langfuse.py \
            tests/test_litellm/proxy/db/test_db_spend_update_writer.py \
            tests/proxy_unit_tests/test_update_spend.py \
            tests/test_litellm/proxy/test_spend_log_cleanup.py
          uv run --no-sync pytest -q \
            tests/test_litellm/litellm_core_utils/test_litellm_logging.py \
            -k test_responses_usage_callback_survives_redacted_transport_state
          uv run --no-sync pytest -q \
            tests/test_litellm/test_router.py \
            tests/test_litellm/test_utils.py \
            tests/test_litellm/litellm_core_utils/test_core_helpers.py \
            -k 'retry_history or request_retry_cap or request_retry_state or retry_breadcrumbs'

      - name: Verify OSS dependency graph and imports
        run: |
          ! grep -q 'name = "litellm-enterprise"' uv.lock
          ! grep -q 'litellm-enterprise' pyproject.toml
          uv run --no-sync python tests/code_coverage_tests/check_unsafe_enterprise_import.py
          uv run --no-sync python tests/code_coverage_tests/check_licenses.py
          cargo fetch --locked --manifest-path litellm-rust/Cargo.toml
          uv run --no-sync python scripts/generate_openorange_native_notices.py

      - name: Build wheel
        run: |
          uv build --wheel
          uv run --no-sync python tests/code_coverage_tests/check_openorange_artifact.py \
            --wheel dist/*.whl --license-sha256 "$(sha256sum LICENSE | cut -d ' ' -f 1)" \
            --native-notices-sha256 "$(sha256sum litellm-rust/THIRD_PARTY_NOTICES.txt | cut -d ' ' -f 1)" \
            --rust-notices-sha256 "$(sha256sum litellm-rust/notices/RUST-COPYRIGHT-library.html | cut -d ' ' -f 1)"

  image:
    name: Build OSS runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag litellm-openorange:ci .

      - name: Verify installed OSS runtime
        run: |
          docker run --rm --interactive --network none --entrypoint python litellm-openorange:ci \
            - --license-sha256 "$(sha256sum LICENSE | cut -d ' ' -f 1)" \
            --native-notices-sha256 "$(sha256sum litellm-rust/THIRD_PARTY_NOTICES.txt | cut -d ' ' -f 1)" \
            --rust-notices-sha256 "$(sha256sum litellm-rust/notices/RUST-COPYRIGHT-library.html | cut -d ' ' -f 1)" \
            < tests/code_coverage_tests/check_openorange_artifact.py

  pi-inference:
    name: Private Pi inference checks and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/pi-inference
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: services/pi-inference/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check production licenses and OSS-only package boundary
        run: |
          npm ls --omit=dev --all
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json'));
          // Unlicense: fast-sha256, via @anthropic-ai/sdk -> standardwebhooks (OSI-approved public-domain dedication).
          const allowed = new Set(['MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', 'MPL-2.0', '0BSD', 'Unlicense']);
          assert.equal(lock.packages[''].dependencies['@earendil-works/pi-ai'], '0.87.1');
          assert.equal(lock.packages[''].dependencies.zod, '4.4.3');
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (!path || entry.dev) continue;
            const pkg = JSON.parse(readFileSync(`${path}/package.json`, 'utf8'));
            assert.equal(pkg.version, entry.version, `Version mismatch: ${path}`);
            assert.equal(pkg.license, entry.license, `License metadata mismatch: ${path}`);
            assert(allowed.has(pkg.license), `License review required: ${pkg.name} (${pkg.license})`);
            assert(!/enterprise|pi-agent-core|pi-coding-agent/i.test(pkg.name), `Forbidden runtime package: ${pkg.name}`);
          }
          JS

      - name: Typecheck, build, offline tests, and formatting
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run lint
          node --check tests/smoke.mjs
          node dist/main.js catalog > /dev/null

      - name: Build private service image
        run: docker build --tag pi-inference:ci .
