name: OpenOrange Fork CI

on:
  pull_request:
    branches: [openorange]
  push:
    branches: [openorange]

permissions:
  contents: read

concurrency:
  group: openorange-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Fork regressions and OSS guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"

      - name: Install test dependencies
        run: >-
          .github/scripts/uv_sync_with_retries.sh --frozen
          --group ci --group proxy-dev
          --extra proxy --extra proxy-runtime --extra extra_proxy
          --extra semantic-router

      - name: Generate Prisma client
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run focused fork regressions
        run: |
          uv run --no-sync pytest -q \
            tests/test_litellm/litellm_core_utils/test_safe_json_dumps.py \
            tests/test_litellm/llms/chatgpt/chat/test_chatgpt_transformation.py \
            tests/test_litellm/llms/chatgpt/responses/test_chatgpt_responses_transformation.py \
            tests/llm_responses_api_testing/test_base_responses_api_streaming_iterator.py \
            tests/test_litellm/proxy/test_litellm_pre_call_utils.py \
            tests/test_litellm/proxy/spend_tracking/test_spend_tracking_utils.py \
            tests/test_litellm/integrations/test_langfuse.py \
            tests/test_litellm/proxy/db/test_db_spend_update_writer.py \
            tests/proxy_unit_tests/test_update_spend.py \
            tests/test_litellm/proxy/test_spend_log_cleanup.py

      - name: Verify OSS dependency graph and imports
        run: |
          ! grep -q 'name = "litellm-enterprise"' uv.lock
          ! grep -q 'litellm-enterprise' pyproject.toml
          uv run --no-sync python tests/code_coverage_tests/check_unsafe_enterprise_import.py
          uv run --no-sync python tests/code_coverage_tests/check_licenses.py

      - name: Build wheel
        run: uv build --wheel

  image:
    name: Build OSS runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag litellm-openorange:ci .
